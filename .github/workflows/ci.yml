name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clusterstor
          POSTGRES_PASSWORD: clusterstor
          POSTGRES_DB: clusterstor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clusterstor -d clusterstor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLUSTERSTOR_DATABASE_URL: postgres://clusterstor:clusterstor@localhost:5432/clusterstor?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: Emit canonical module files
        run: |
          echo "===GO_MOD_START==="
          cat go.mod
          echo "===GO_MOD_END==="
          echo "===GO_SUM_START==="
          base64 -w0 go.sum
          echo
          echo "===GO_SUM_END==="
      - run: make migrate-up
      - run: go test ./...
      - name: Cross-compile Windows desktop agent
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/clusterstor-agent.exe ./cmd/agent

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
