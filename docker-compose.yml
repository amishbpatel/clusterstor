services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: clusterstor
      POSTGRES_PASSWORD: clusterstor
      POSTGRES_DB: clusterstor
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clusterstor -d clusterstor"]
      interval: 5s
      timeout: 5s
      retries: 10
