openapi: 3.1.0
info:
  title: ClusterStor API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        '200':
          description: Service healthy
  /api/v1/version:
    get:
      operationId: getVersion
      responses:
        '200':
          description: API version
  /api/v1/auth/signup:
    post:
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me:
    get:
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/devices:
    get:
      operationId: listDevices
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Registered devices
    post:
      operationId: registerDevice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered. The secret is returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegistration'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/providers:
    get:
      operationId: listProviders
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Connected storage providers
  /api/v1/providers/google_drive/oauth/start:
    post:
      operationId: startGoogleDriveOAuth
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Google Drive authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthStart'
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/providers/google_drive/callback:
    get:
      operationId: completeGoogleDriveOAuth
      parameters:
        - in: query
          name: state
          required: true
          schema: { type: string }
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Google Drive account connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAccount'
        '400': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/providers/google_drive/files:
    get:
      operationId: listGoogleDriveFiles
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: cursor
          required: false
          schema: { type: string }
        - in: query
          name: page_size
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: Google Drive files synchronized into ClusterStor nodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrivePage'
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/providers/google_drive/root:
    post:
      operationId: ensureGoogleDriveRoot
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ensure the dedicated ClusterStor folder exists in Google Drive
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/providers/google_drive/folders:
    post:
      operationId: createGoogleDriveFolder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: Folder created beneath the ClusterStor provider root
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveItem'
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/providers/google_drive/uploads:
    post:
      operationId: beginGoogleDriveUpload
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginUploadRequest'
      responses:
        '201':
          description: Resumable Google Drive upload session created beneath the ClusterStor provider root
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/providers/google_drive/uploads/complete:
    post:
      operationId: finalizeGoogleDriveUpload
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeUploadRequest'
      responses:
        '201':
          description: Uploaded Google Drive object finalized into a ClusterStor file version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizedUpload'
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/nodes/{id}/download:
    get:
      operationId: downloadNode
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Range
          required: false
          schema: { type: string }
      responses:
        '200':
          description: File content
        '206':
          description: Partial file content
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/devices/{id}:
    delete:
      operationId: revokeDevice
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Device revoked }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        display_name: { type: [string, 'null'] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      required: [id, email, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    RegisterDeviceRequest:
      type: object
      required: [name, platform]
      properties:
        name: { type: string }
        platform: { type: string }
        agent_version: { type: [string, 'null'] }
    Device:
      type: object
      required: [id, name, platform, status, peer_contribution_enabled, peer_contribution_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string }
        agent_version: { type: [string, 'null'] }
        status: { type: string }
        peer_contribution_enabled: { type: boolean }
        peer_contribution_bytes: { type: integer, format: int64 }
        last_seen_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    DeviceRegistration:
      type: object
      required: [device, secret]
      properties:
        device: { $ref: '#/components/schemas/Device' }
        secret: { type: string }
    OAuthStart:
      type: object
      required: [authorization_url, expires_at]
      properties:
        authorization_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    ProviderAccount:
      type: object
      required: [id, provider, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        external_account_id: { type: [string, 'null'] }
        display_name: { type: [string, 'null'] }
        status: { type: string }
        quota_total_bytes: { type: [integer, 'null'], format: int64 }
        quota_used_bytes: { type: [integer, 'null'], format: int64 }
        quota_free_bytes: { type: [integer, 'null'], format: int64 }
        last_synced_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DriveItem:
      type: object
      required: [node_id, provider_item_id, name, node_type]
      properties:
        node_id: { type: string, format: uuid }
        provider_item_id: { type: string }
        parent_item_id: { type: [string, 'null'] }
        name: { type: string }
        node_type: { type: string, enum: [file, folder] }
        mime_type: { type: string }
        size_bytes: { type: [integer, 'null'], format: int64 }
        modified_at: { type: [string, 'null'], format: date-time }
    DrivePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DriveItem' }
        next_page_token: { type: string }
    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        parent_node_id: { type: [string, 'null'], format: uuid }
    BeginUploadRequest:
      type: object
      required: [name, size_bytes]
      properties:
        name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        parent_node_id: { type: [string, 'null'], format: uuid }
    UploadSession:
      type: object
      required: [upload_url, parent_provider_id, name, content_type, size_bytes]
      properties:
        upload_url: { type: string, format: uri }
        parent_provider_id: { type: string }
        name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
    FinalizeUploadRequest:
      type: object
      required: [provider_item_id]
      properties:
        provider_item_id: { type: string }
    FinalizedUpload:
      type: object
      required: [node_id, version_id, provider_item_id, name, size_bytes]
      properties:
        node_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        provider_item_id: { type: string }
        name: { type: string }
        size_bytes: { type: integer, format: int64 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
